name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_USE_LOCAL_STORAGE: false
          VITE_FIREBASE_API_KEY: "AIzaSyAXPkHIZrYcxllt9JTknEQHeAIxtkDtk40"
          VITE_FIREBASE_AUTH_DOMAIN: "simplescoringapp.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "simplescoringapp"
          VITE_FIREBASE_STORAGE_BUCKET: "simplescoringapp.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "211846757609"
          VITE_FIREBASE_APP_ID: "1:211846757609:web:6e40e94832551f61ba0478"

      - name: Add .nojekyll
        run: touch ./dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
